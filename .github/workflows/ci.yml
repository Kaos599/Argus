name: ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: API contract (shared ↔ frontend/src/shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared/ and frontend/src/shared/api-types.ts are in sync
        run: |
          set -euo pipefail
          diff -q shared/api-types.ts frontend/src/shared/api-types.ts

  backend:
    name: backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install uv
        run: pip install --upgrade pip uv
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .
      - name: Test (pytest)
        run: pytest -v --tb=short
      - name: Import smoke test
        run: python -c "from argus.main import app; routes=[r.path for r in app.routes if hasattr(r,'path')]; api=[r for r in routes if r.startswith('/api/v1/')]; assert len(api)>=11, f'expected >=11 API routes, got {len(api)}: {api}'; print(f'OK: {len(api)} API routes registered')"

  frontend:
    name: frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Lint (eslint)
        run: npm run lint
      - name: Test (vitest)
        run: npm test
      - name: Build (next build)
        run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCK_DATA: "true"
      - name: Verify no secrets leaked into the bundle
        run: |
          ! grep -rIn --include='*.js' --include='*.css' -E 'sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}' .next/ || (echo "Secret pattern found in build output" && exit 1)

  scripts:
    name: scripts (seed_demo_data.py syntax + import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/seed_demo_data.py
      - name: Import check
        run: |
          python -c "
          import ast, sys
          tree = ast.parse(open('scripts/seed_demo_data.py').read())
          names = [n.name for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))]
          for required in ('gen_user','gen_event','gen_order','main','bulk_insert'):
              assert required in names, f'missing function: {required}'
          print(f'OK: required functions present: gen_user, gen_event, gen_order, main, bulk_insert')
          "

  compose:
    name: docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          python -c "import yaml; yaml.safe_load(open('docker-compose.yml'))" && echo "docker-compose.yml: valid YAML"
