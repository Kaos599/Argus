[project]
name = "argus-backend"
version = "0.1.0"
description = "Argus — the agentic analyst for MongoDB Atlas. FastAPI backend with per-tenant MCP subprocess management and 5 read-only insight modules."
requires-python = ">=3.12"
authors = [{ name = "Argus Team" }]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "google-generativeai>=0.8.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "httpx>=0.28.0",
    "respx>=0.21.0",
    "pymongo>=4.6.0",
]

[project.scripts]
argus = "argus.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # Use of assert detected (we use pytest assertions)
    "B008",  # Do not perform function calls in argument defaults (FastAPI uses Depends)
    "E501",  # Line too long (formatter handles this)
    "RUF012", # Mutable class default (insight modules use these as class constants)
    "UP042",  # replace-str-enum (we prefer explicit str Enum values for forward compat)
    "S112",   # try-except-continue (acceptable for graceful degradation paths)
    "F841",   # unused-variable (often tuple unpacking we don't need)
    "RUF005", # collection-literal-concatenation (idiomatic in some places)
    "RUF022", # unsorted-dunder-all (manual control preferred)
    "S104",   # hardcoded-bind-all-interfaces (healthz binds 0.0.0.0 on purpose)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"argus/api/**/*.py" = ["B008"]

[tool.coverage.run]
source = ["argus"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
